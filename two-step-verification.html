<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Working Attachment Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    background:#f3f4f8;
    padding:40px;
}

.container{
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.05);
}

.section-title{
    font-size:20px;
    font-weight:600;
    margin-bottom:20px;
}

/* Card */
.card{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    border-radius:15px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    margin-bottom:20px;
}

.ribbon{
    position:absolute;
    top:-5px;
    left:-5px;
    background:#ef4444;
    color:#fff;
    font-size:11px;
    padding:5px 12px;
    border-radius:0 10px 10px 0;
}

.file-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.file-icon{
    width:50px;
    height:50px;
    border-radius:10px;
    background:#e0e7ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
}

.actions{
    display:flex;
    gap:10px;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.preview-btn{background:#dbeafe;}
.download-btn{background:#eef2ff;}
.delete-btn{background:#fee2e2;color:#b91c1c;}

.progress-bar{
    height:6px;
    background:#e5e7eb;
    border-radius:5px;
    overflow:hidden;
    margin-top:8px;
    display:none;
}

.progress{
    height:100%;
    width:0%;
    background:#2563eb;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

.modal-content{
    width:90%;
    max-width:900px;
    background:#fff;
    padding:20px;
    border-radius:15px;
    position:relative;
}

.close-btn{
    position:absolute;
    top:10px;
    right:15px;
    font-size:18px;
    cursor:pointer;
}

iframe, img{
    width:100%;
    height:500px;
    object-fit:contain;
}

</style>
</head>
<body>

<div class="container">

    <div class="section-title">Attachments</div>

    <!-- PDF Card -->
    <div class="card" id="pdfCard">
        <div class="ribbon">NEW</div>
        <div>
            <div class="file-info">
                <div class="file-icon">PDF</div>
                <div>
                    sample-planner.pdf
                    <div class="progress-bar" id="pdfBar">
                        <div class="progress" id="pdfProgress"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="preview-btn"
                onclick="previewFile('./sample.pdf','pdf')">
                Preview
            </button>
            <button class="download-btn"
                onclick="downloadFile('/sample.pdf','pdfProgress','pdfBar')">
                Download
            </button>
            <button class="delete-btn" onclick="deleteCard('pdfCard')">
                Delete
            </button>
        </div>
    </div>

    <!-- Image Card -->
    <div class="card" id="imgCard">
        <div>
            <div class="file-info">
                <div class="file-icon">IMG</div>
                sample-image.jpg
            </div>
        </div>

        <div class="actions">
            <button class="preview-btn"
                onclick="previewFile('https://picsum.photos/900/600','img')">
                Preview
            </button>
            <button class="download-btn"
                onclick="downloadFile('https://picsum.photos/900/600')">
                Download
            </button>
            <button class="delete-btn" onclick="deleteCard('imgCard')">
                Delete
            </button>
        </div>
    </div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">✖</span>
        <div id="previewContainer"></div>
    </div>
</div>

<script>

/* Preview */
function previewFile(url,type){
    const container=document.getElementById("previewContainer");
    container.innerHTML="";
    document.getElementById("modal").style.display="flex";

    if(type==="pdf"){
        container.innerHTML=`<iframe src="${url}"></iframe>`;
    } else {
        container.innerHTML=`<img src="${url}">`;
    }
}

/* Close Modal */
function closeModal(){
    document.getElementById("modal").style.display="none";
}

/* Download (real fetch) */
async function downloadFile(url,progressId=null,barId=null){

    if(barId){
        document.getElementById(barId).style.display="block";
    }

    const response = await fetch(url);
    const blob = await response.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    if(progressId){
        let progress=document.getElementById(progressId);
        let percent=0;
        let interval=setInterval(()=>{
            percent+=10;
            progress.style.width=percent+"%";
            if(percent>=100){
                clearInterval(interval);
                setTimeout(()=>{
                    document.getElementById(barId).style.display="none";
                    progress.style.width="0%";
                },500);
            }
        },50);
    }
}

/* Delete */
function deleteCard(id){
    document.getElementById(id).remove();
}

</script>

</body>
</html>
